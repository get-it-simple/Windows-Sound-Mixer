name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      requirements_changed: ${{ steps.changes.outputs.requirements_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Pin commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' sound_mixer/__init__.py)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$GITHUB_REF_NAME" = "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect dependency changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
          elif [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [[ -z "$base" ]]; then
            changed=true
          elif git diff --quiet "$base" HEAD -- requirements.txt; then
            changed=false
          else
            changed=true
          fi
          echo "requirements_changed=$changed" >> "$GITHUB_OUTPUT"

  dependency-audit:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: needs.prepare.outputs.requirements_changed == 'true'
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v6
        if: needs.prepare.outputs.requirements_changed == 'true'
        with:
          python-version: "3.11"
      - name: Audit requirements
        if: needs.prepare.outputs.requirements_changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt
      - name: No dependency changes
        if: needs.prepare.outputs.requirements_changed != 'true'
        run: echo "requirements.txt is unchanged in the triggering change."

  test:
    needs: [prepare, dependency-audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    needs: [prepare, dependency-audit]
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Build application
        run: python build.py
      - name: Sign application when configured
        shell: pwsh
        run: ./scripts/sign-artifacts.ps1 -Paths dist/SoundMixer.exe

      - name: Install pinned NSIS 3.12
        shell: pwsh
        run: |
          $url = "https://prdownloads.sourceforge.net/nsis/nsis-3.12-setup.exe"
          $setup = Join-Path $env:RUNNER_TEMP "nsis-3.12-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup

          # SourceForge can return an HTML landing page with a signed, short-lived
          # mirror URL instead of following it as an HTTP redirect.
          $header = [System.IO.File]::ReadAllBytes($setup)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            $html = Get-Content -LiteralPath $setup -Raw
            $match = [regex]::Match($html, 'http-equiv="refresh" content="\d+; url=([^"\s]+)"')
            if (-not $match.Success) { throw "NSIS download did not return an executable or a SourceForge mirror redirect" }

            $mirrorUrl = [System.Net.WebUtility]::HtmlDecode($match.Groups[1].Value)
            $mirrorUri = [uri]$mirrorUrl
            if ($mirrorUri.Scheme -ne 'https' -or -not $mirrorUri.Host.EndsWith('.sourceforge.net')) {
              throw "Unexpected NSIS mirror URL: $mirrorUrl"
            }
            Invoke-WebRequest -Uri $mirrorUri -OutFile $setup
          }

          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          $expected = "3BC2B06253A7E4957111BE152AC6A536E0C7478A706E19DA814038DB5D706495"
          if ($actual -ne $expected) { throw "NSIS installer hash mismatch: $actual" }
          $process = Start-Process -FilePath $setup -ArgumentList /S -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS setup failed with exit code $($process.ExitCode)" }

      - name: Build installers without warnings
        shell: pwsh
        run: |
          $makeNsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          ./scripts/build-installers.ps1 -Version '${{ needs.prepare.outputs.version }}' -MakeNsis $makeNsis
      - name: Sign installers when configured
        shell: pwsh
        run: ./scripts/sign-artifacts.ps1 -Paths (Get-ChildItem dist/installers/*.exe | ForEach-Object FullName)

      - name: Installer smoke tests
        shell: pwsh
        run: |
          ./scripts/installer-smoke-test.ps1 -Scope user -Installer "dist/installers/SoundMixer-${{ needs.prepare.outputs.version }}-x64-user-setup.exe" -Version '${{ needs.prepare.outputs.version }}'
          ./scripts/installer-smoke-test.ps1 -Scope machine -Installer "dist/installers/SoundMixer-${{ needs.prepare.outputs.version }}-x64-machine-setup.exe" -Version '${{ needs.prepare.outputs.version }}'
          ./scripts/installer-migration-smoke-test.ps1 -UserInstaller "dist/installers/SoundMixer-${{ needs.prepare.outputs.version }}-x64-user-setup.exe" -MachineInstaller "dist/installers/SoundMixer-${{ needs.prepare.outputs.version }}-x64-machine-setup.exe" -Version '${{ needs.prepare.outputs.version }}'

      - name: Prepare checksums and WinGet bundle
        shell: pwsh
        run: ./scripts/prepare-release.ps1 -Version '${{ needs.prepare.outputs.version }}' -Repository '${{ github.repository }}'

      - name: Validate checksums and WinGet manifests
        shell: pwsh
        run: |
          ./scripts/verify-release.ps1 -Version '${{ needs.prepare.outputs.version }}'
          winget validate --manifest dist/winget --disable-interactivity --ignore-warnings

      - uses: actions/upload-artifact@v7
        with:
          name: sound-mixer-${{ needs.prepare.outputs.version }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sound-mixer-${{ needs.prepare.outputs.version }}
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$version" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$version" release/* --verify-tag --generate-notes --title "$version" --repo "$GITHUB_REPOSITORY"
          fi
